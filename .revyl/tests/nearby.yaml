test:
    metadata:
        name: nearby
        platform: ios
        tags:
            - snapback
            - stretch
    build:
        name: Snapback iOS
    blocks:
        - type: module_import
          module: snapback-onboard-demo
        - type: manual
          step_type: wait
          step_description: "15"
        - type: while
          condition: Is the top Inbox card something other than a Place card for Ramen Nagi?
          body:
            - type: instructions
              step_description: Tap the X (Archive) button below the card.
        - type: instructions
          step_description: Tap the heart (Tuck) button to tuck the Ramen Nagi card.
        - type: manual
          step_type: set_location
          step_description: 37.4449,-122.1610
        - type: instructions
          step_description: Open the Today tab.
        - type: if
          condition: Is a system dialog asking for location access visible?
          then:
            - type: instructions
              step_description: Tap "Allow While Using App".
        - type: validation
          step_description: A card says "You're" some meters "from Ramen Nagi".
