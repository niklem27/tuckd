test:
    metadata:
        name: first-run
        platform: ios
        tags:
            - smoke
            - snapback
    build:
        name: Snapback iOS
    blocks:
        - type: instructions
          step_description: On the welcome screen, tap "Get started".
        - type: instructions
          step_description: Tap "Allow photo access".
        - type: if
          condition: Is a system dialog asking for photo library access visible?
          then:
            - type: instructions
              step_description: Tap "Allow Full Access" (or "Allow Access to All Photos").
        - type: if
          condition: Is a "Continue" button visible?
          then:
            - type: instructions
              step_description: Tap "Continue".
        - type: instructions
          step_description: Tap "Not now" on the morning brief screen.
        - type: instructions
          step_description: Tap "Load demo screenshots".
        - type: validation
          step_description: A banner that says "Sorting" followed by a number of screenshots is visible near the top of the Inbox.
        - type: manual
          step_type: wait
          step_description: "45"
        - type: validation
          step_description: A card is visible in the Inbox and the progress text near the title says at least "5 left".
